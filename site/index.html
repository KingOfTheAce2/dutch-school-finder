<!doctype html>
<html lang="en" dir="ltr">
<head>
<!--@head-->
</head>
<body<!--@bodyattrs-->>
<div id="boot" class="boot" role="status" hidden data-fail="The page text could not be loaded. Please reload the page.">Loading...</div>

<a class="skip" href="#main" id="skip" data-i18n="a11y.skip"></a>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-school" viewBox="0 0 24 24"><path d="M3 21V10l9-6 9 6v11z"/><path d="M9 21v-6h6v6"/></symbol>
    <symbol id="i-fork" viewBox="0 0 24 24"><path d="M12 21V12M12 12L5 5M12 12l7-7M5 5v5M5 5h5M19 5v5M19 5h-5"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M3 5h8v15H3zM13 5h8v15h-8z"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20l1-5L16 4l4 4L9 19zM14 6l4 4"/></symbol>
    <symbol id="i-tool" viewBox="0 0 24 24"><path d="M5 21l8-8M11 7l4-4 6 6-4 4z"/></symbol>
    <symbol id="i-cap" viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5zM6 11v5c3 2 9 2 12 0v-5"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12l5 5 11-11"/></symbol>
    <symbol id="i-lines" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></symbol>
  </defs>
</svg>

<header class="mast">
  <div class="wrap">
    <div class="logo" role="img" data-i18n-attr="aria-label:brand.name">
      <svg viewBox="0 0 28 28" aria-hidden="true"><rect x="11" y="0" width="6" height="28" fill="currentColor"/><rect x="5" y="3" width="18" height="6" fill="var(--accent)" stroke="currentColor" stroke-width="3"/><rect x="5" y="11" width="18" height="6" fill="var(--accent)" stroke="currentColor" stroke-width="3"/><rect x="5" y="19" width="18" height="6" fill="var(--accent)" stroke="currentColor" stroke-width="3"/></svg>
      <span data-i18n="brand.name"></span>
    </div>
    <div class="mr"><small data-i18n="brand.tagline"></small><div id="langsw"></div></div>
  </div>
</header>

<div class="tabbar">
  <div class="wrap">
    <nav class="tabs" id="nav" data-i18n-attr="aria-label:nav.aria">
      <a class="tab" id="t-route" data-route="route" data-i18n="nav.route"></a>
      <a class="tab" id="t-find" data-route="find" data-i18n="nav.find"></a>
      <a class="tab" id="t-map" data-route="map" data-i18n="nav.map"></a>
      <a class="tab" id="t-system" data-route="system" data-i18n="nav.system"></a>
      <a class="tab" id="t-faq" data-route="faq" data-i18n="nav.faq"></a>
      <a class="tab" id="t-sources" data-route="sources" data-i18n="nav.sources"></a>
    </nav>
  </div>
</div>

<section class="hero" aria-labelledby="h1">
  <div class="wrap">
    <!--@h1-->
    <div class="valsbox">
      <ul class="vals">
        <li><b>1</b><span data-i18n="hero.v1"></span></li>
        <li><b>2</b><span data-i18n="hero.v2"></span></li>
        <li><b>3</b><span data-i18n="hero.v3"></span></li>
      </ul>
    </div>
    <form class="q" id="f" novalidate aria-describedby="exline">
      <div>
        <label for="age" data-i18n="form.ageLabel"></label>
        <select class="fld" id="age" name="age"><!--@ageopts--></select>
      </div>
      <div>
        <label for="pc" data-i18n="form.pcLabel"></label>
        <input class="fld" id="pc" name="pc" type="text" inputmode="text" autocomplete="postal-code" maxlength="8" aria-describedby="pc-hint" data-i18n-attr="placeholder:form.pcPlaceholder">
        <div class="hint" id="pc-hint" data-i18n="form.pcHint"></div>
      </div>
      <div class="full"><button class="btn" type="submit" id="go" style="width:100%" data-i18n="form.go"></button></div>
      <div class="full exrow" id="exrow" role="group" data-i18n-attr="aria-label:form.tryExample"><!--@exrow--></div>
      <p class="ferr full" id="ferr" role="alert" aria-live="assertive"></p>
      <p class="priv full" id="exline" data-i18n="form.privacy"></p>
    </form>
  </div>
</section>

<main id="main" class="wrap" tabindex="-1">
  <div class="status" id="status" aria-live="polite"></div>

  <section id="p-route"<!--@hide:route-->>
    <div class="resbar" id="resbar"></div>
    <p class="resmeta" id="resmeta"></p>
    <div id="muni"></div>
    <details class="gloss">
      <summary data-i18n="gloss.title"></summary>
      <dl id="gloss-dl"><!--@gloss--></dl>
    </details>
    <div id="route-empty" class="intro">
      <h2 data-i18n="empty.title"></h2>
      <p data-i18n="empty.text"></p>
      <ul>
        <li data-i18n="empty.i1"></li>
        <li data-i18n="empty.i2"></li>
        <li data-i18n="empty.i3"></li>
      </ul>
      <p><a data-route="find" data-i18n="empty.findLink"></a> &middot; <a data-route="system" data-i18n="empty.systemLink"></a></p>
      <!--@homelinks-->
    </div>
    <div id="route-body">
      <div id="next"></div>
      <ol class="route" id="route" data-i18n-attr="aria-label:route.aria"></ol>
      <p class="note" id="routenote" data-i18n="route.note"></p>
    </div>
  </section>

  <section id="p-find"<!--@hide:find-->>
    <h2 class="vh" id="h-find" tabindex="-1" data-i18n="find.title"></h2>
    <p class="resmeta" data-i18n="find.intro"></p>
    <details class="gloss fdet" id="find-fdet" open><summary id="find-fsum" data-i18n="filters.summary"></summary><div id="find-form" style="margin-top:10px"></div></details>
    <div id="find-out"><!--@findout--></div>
  </section>

  <section id="p-map"<!--@hide:map-->>
    <h2 class="vh" id="h-map" tabindex="-1" data-i18n="map.title"></h2>
    <p class="resmeta"><span data-i18n="map.intro"></span> <span data-i18n="map.prefer"></span> <a id="map-list-link" data-route="find" data-i18n="map.listLink"></a></p>
    <details class="gloss fdet" id="map-fdet"><summary id="map-fsum" data-i18n="filters.summary"></summary><div id="map-form" style="margin-top:10px"></div></details>
    <div id="map-out"><!--@mapout--></div>
  </section>

  <section id="p-school"<!--@hide:school-->>
    <div id="school-out"<!--@schoolattrs-->><!--@school--></div>
  </section>

  <section id="p-compare"<!--@hide:compare-->>
    <h2 class="vh" id="h-compare" tabindex="-1" data-i18n="cmp.title"></h2>
    <div id="compare-out"><!--@compareout--></div>
  </section>

  <section id="p-system"<!--@hide:system-->>
    <h2 class="vh" data-i18n="sys.heading"></h2>
    <p style="max-width:62ch" data-i18n="sys.intro"></p>
    <div class="sysgrid">
      <figure class="sysfig" style="margin:0">
        <div id="sysfig"><!--@sysfig--></div>
      </figure>
      <div>
        <ul class="keys" id="syskeys" data-i18n-attr="aria-label:sys.keyAria"><!--@syskeys--></ul>
        <p class="note" style="margin-top:0" data-i18n="sys.arrowNote"></p>
        <ol class="xfers" id="xfers"><!--@xfers--></ol>
        <p class="src" id="syssrc"><!--@syssrc--></p>
      </div>
    </div>
  </section>

  <section id="p-faq"<!--@hide:faq-->>
    <h2 class="vh" data-i18n="faq.heading"></h2>
    <div class="faq" id="faq"><!--@faq--></div>
  </section>

  <section id="p-static"<!--@hide:static-->>
<!--@static-->
  </section>

  <section id="p-sources"<!--@hide:sources-->>
    <h2 class="vh" id="h-sources" tabindex="-1" data-i18n="sources.heading"></h2>
    <p style="max-width:62ch" data-i18n="sources.intro"></p>
    <div id="sources-out"><!--@sourcesout--></div>
  </section>
</main>

<div class="cbar" id="cbar" role="region" data-i18n-attr="aria-label:cmp.listAria" hidden></div>

<footer>
  <div class="wrap">
    <p><b data-i18n="brand.name"></b> &middot; <span data-i18n="foot.notAffiliated"></span> <a data-route="sources" data-i18n="foot.sourcesLink"></a></p>
    <p id="foot-checked"><!--@footchecked--></p>
  </div>
</footer>

<script src="<!--@appjs-->"></script>
</body>
</html>
